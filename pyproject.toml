[project]
name = "rubikbench"
version = "0.1.0"
description = "LLM benchmark suite for Rubik's cube solving via OpenAI-compatible APIs, with a Textual TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0",
    "openai>=1.40",
    "rich>=13.7",
]

[project.optional-dependencies]
solver = ["kociemba>=1.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
rubikbench = "rubikbench.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rubikbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "ruff>=0.16.4",
]
